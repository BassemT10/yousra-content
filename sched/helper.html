<!doctype html><html><head><meta charset="utf-8"><title>يُسرى — مساعد الجدولة</title>
<style>body{font-family:system-ui;background:#0B3D2E;color:#FBFAF6;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}</style></head>
<body><div><h2>مساعد جدولة يُسرى</h2><p id="s">يعمل… اترك هذه النافذة مفتوحة أثناء الجدولة.</p></div>
<script>
// يرسل ملفات الجدولة (من هذا الموقع نفسه) إلى صفحة Meta Business Suite التي فتحته.
const OK=['https://business.facebook.com'];
let n=0;
window.addEventListener('message', async e=>{
  if(!OK.includes(e.origin) || !e.data || e.data.t!=='get') return;
  try{
    const r=await fetch(e.data.path); if(!r.ok) throw new Error('HTTP '+r.status);
    const buf=await r.arrayBuffer();
    e.source.postMessage({t:'file', id:e.data.id, name:e.data.path.split('/').pop(), type:r.headers.get('content-type'), buf}, e.origin, [buf]);
    document.getElementById('s').textContent='أُرسل '+(++n)+' ملف';
  }catch(err){ e.source.postMessage({t:'err', id:e.data.id, msg:String(err)}, e.origin); }
});
if(window.opener) window.opener.postMessage({t:'ready'}, OK[0]);
</script></body></html>
